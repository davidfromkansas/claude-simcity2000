<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attempt Post-mortem</title>
<meta name="description" content="Claudeville 4: what went wrong in one attempt and what changes next time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{color-scheme:light;--bg:#EEF1F0;--surface:#FFFFFF;--border:#D5DCD9;--line:#E2E7E5;--ink:#14211F;--ink-2:#4A5A56;--accent:#17604A;--accent-2:#C2410C;--hero:#14211F;--hero-ink:#EEF1F0;--hot:#FFB27A;--soft:#F3F5F4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1716;--surface:#16211F;--border:#2A3836;--line:#22302E;--ink:#E8EEEC;--ink-2:#AEBDB9;--accent:#4FB892;--accent-2:#F07A45;--hero:#1D2C29;--soft:#1B2826}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1716;--surface:#16211F;--border:#2A3836;--line:#22302E;--ink:#E8EEEC;--ink-2:#AEBDB9;--accent:#4FB892;--accent-2:#F07A45;--hero:#1D2C29;--soft:#1B2826}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:36px 16px 64px;display:flex;flex-direction:column;gap:22px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.08em;color:var(--accent-2)}
#doc h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(34px,6vw,48px);line-height:1.05;margin:6px 0 12px}
#doc h2{font-family:"Space Grotesk",sans-serif;font-size:26px;margin:34px 0 10px}
#doc p{margin:0 0 14px} #doc li{margin-bottom:8px}
#doc strong{font-weight:600}
#doc em{color:var(--ink-2)}
#doc table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 16px;font-variant-numeric:tabular-nums}
#doc th{text-align:left;font-size:13px;color:var(--ink-2);padding:8px 10px;border-bottom:2px solid var(--ink)}
#doc td{padding:9px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 14px}
#doc ol>li::marker{font-family:"IBM Plex Mono",monospace;color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
button{font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><a href="../dashboard/">← Attempt dashboard</a> · <a href="../../">Claudeville 4 overview</a></span>
    <button id="themeBtn" aria-label="Switch light or dark theme">◐</button></div>
  <div class="tag" id="tag">POST-MORTEM</div>
  <article id="doc">Loading…</article>
</div>
<script>
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
};
const n = (location.pathname.match(/attempt-(\d+)/) || [, "?"])[1];
document.title = "Claudeville 4 · Attempt " + n + " post-mortem";
document.getElementById("tag").textContent = "POST-MORTEM · CLAUDEVILLE 3 · ATTEMPT " + n;
fetch("post-mortem.md?v=" + Date.now()).then(r => r.text()).then(md => {
  const html = marked.parse(md.replace(/^# .*\n/, m => m));
  const doc = document.getElementById("doc");
  doc.innerHTML = html;
  doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "scroll"; t.replaceWith(w); w.appendChild(t); });
  doc.querySelectorAll('a[href$=".md"]').forEach(a => { a.href = a.getAttribute("href"); });
}).catch(() => { document.getElementById("doc").textContent = "Post-mortem not written yet."; });
</script>
</body>
</html>
